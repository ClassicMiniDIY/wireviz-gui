[project]
name = "wireviz-gui-sidecar"
version = "0.1.0"
description = "FastAPI sidecar wrapping wireviz 1.0.0 for the wireviz-gui frontend"
requires-python = ">=3.11"
# Floors sit at the first release that clears every known advisory
# (pip-audit, 2026-11). starlette and h11 are transitive (fastapi,
# uvicorn) but listed so a resolver can never pick a vulnerable one.
dependencies = [
    "fastapi>=0.115",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32",
    "h11>=0.16",
    "python-multipart>=0.0.31",
    "pyyaml>=6.0",
    "pillow>=13.0",
    "wireviz @ file:///Users/colegentry/Development/WireViz",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27",
]

[project.scripts]
wireviz-gui-sidecar = "wireviz_gui_sidecar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wireviz_gui_sidecar*"]
